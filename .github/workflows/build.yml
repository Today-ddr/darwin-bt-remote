name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (optional, e.g. v0.0.5)"
        required: false
        type: string

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          which xcodegen || brew install xcodegen
          which xcbeautify || brew install xcbeautify

      - name: Prepare project
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: |
          chmod +x ci_scripts/ci_post_clone.sh
          ci_scripts/ci_post_clone.sh

      # The bundle version must come from the tag, not from project.yml: building a
      # v0.2.0 tag while project.yml still said 0.1.0 published an artifact whose
      # CFBundleShortVersionString disagreed with the release it was attached to.
      - name: Derive version from tag
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # only a vX.Y.Z tag pins the version; branch builds keep project.yml's value
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
            echo "VERSION_OVERRIDES=MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER:-1}" >> "$GITHUB_ENV"
            echo "Version pinned from tag: $VERSION"
          else
            echo "VERSION_OVERRIDES=" >> "$GITHUB_ENV"
            echo "Not a release tag ($TAG); using project.yml's version."
          fi

      # XCTest is only executable on a machine with full Xcode, so CI is the
      # automation gate for the unit tests; the IPA build alone only proves the
      # app compiles.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project BTRemote.xcodeproj \
            -scheme BTRemoteTests \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest" \
            -derivedDataPath .build/DerivedData \
            | xcbeautify

      - name: Build iOS IPA
        run: |
          set -o pipefail
          PROJECT="BTRemote"
          xcodebuild \
            -project $PROJECT.xcodeproj \
            -scheme $PROJECT \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            $VERSION_OVERRIDES \
            build | xcbeautify

          rm -rf .build/Payload
          mkdir -p .build/Payload
          cp -R .build/DerivedData/Build/Products/Release-iphoneos/$PROJECT.app .build/Payload/
          test -f .build/Payload/$PROJECT.app/$PROJECT || { echo "Binary not found in app bundle!"; exit 1; }
          cd .build
          zip -qry ../$PROJECT.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTRemote-iOS-IPA
          path: BTRemote.ipa
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BTRemote-iOS-IPA
          path: release-artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" \
            release-artifacts/BTRemote.ipa \
            --title "$TAG" \
            --notes "Automated release build for $TAG"
